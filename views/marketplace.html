<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UstaMart — Materiallar bozori</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
</head>
<body>
<nav class="navbar">
  <div class="nav-left">
    <button class="nav-back" onclick="history.back()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span data-lang="back">Orqaga</span>
    </button>
  </div>
  <div class="nav-center">
    <a href="/" class="nav-logo"><img src="/images/logo-wrench.png" alt="UstaMart" class="nav-logo-icon"><span class="nav-logo-text"><span class="logo-top">Usta</span><span class="logo-usta">Mart</span></span></a>
  </div>
  <div class="nav-right">
    <div id="notifArea"></div>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="uz" onclick="setLang('uz')">UZ</button>
      <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
    </div>
    <div id="navUser"></div>
  </div>
</nav>

<div class="mkt-page">

  <!-- ── Hero ── -->
  <div class="mkt-hero">
    <div class="mkt-hero-inner">
      <div class="mkt-hero-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </div>
      <div>
        <h1 class="mkt-hero-title" data-lang="marketplace">Materiallar bozori</h1>
        <p class="mkt-hero-sub" id="mktProductCount">Yuklanmoqda...</p>
      </div>
    </div>
  </div>

  <!-- ── Filters ── -->
  <div class="mkt-filters-wrap">
    <div class="mkt-search-row">
      <div class="mkt-search-box">
        <span class="mkt-search-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input class="mkt-search-input" type="text" id="searchInput" data-lang-placeholder="productSearch" placeholder="Mahsulot qidirish..." oninput="applyFilters()">
      </div>
      <div class="mkt-selects-row">
        <div class="mkt-select-wrap">
          <span class="mkt-select-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          </span>
          <select class="mkt-select" id="filterType" onchange="onTypeSelectChange()">
            <option value="" data-lang="allTypes">Barcha turlar</option>
            <option>Sement</option><option>G'isht</option><option>Bo'yoq</option>
            <option>Plitka</option><option>Qum</option><option>Shag'al</option>
            <option>Yog'och</option><option>Temir</option><option>Shifer</option>
            <option>Armatura</option><option>Gipsokarton</option><option>Shpaklyovka</option>
            <option>Suvoq aralashmasi</option><option>Kabel</option><option>Rozetka</option>
            <option>Truba</option><option>Radiator</option><option>Eshik</option>
            <option>Deraza</option><option>Laminat</option><option>Oboy</option>
            <option>Izolyatsiya</option><option>Mix</option><option>Lak</option><option>Boshqa</option>
          </select>
        </div>
        <div class="mkt-select-wrap">
          <span class="mkt-select-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
          </span>
          <select class="mkt-select" id="filterSort" onchange="onSortSelectChange()">
            <option value="" data-lang="newest">Eng yangi</option>
            <option value="cheapest" data-lang="cheapest">Eng arzon</option>
            <option value="expensive" data-lang="mostExpensive">Eng qimmat</option>
          </select>
        </div>
      </div>
    </div>
    <!-- Quick-filter pills -->
    <div class="mkt-pills-row" id="mktPillsRow"></div>
  </div>

  <!-- ── Products grid ── -->
  <div class="mkt-grid" id="productsGrid">
    <div class="loading-center" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>

</div>

<script src="/js/lang.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/fuzzy-search.js"></script>
<script src="/js/marketplace.js"></script>
</body>
</html>
